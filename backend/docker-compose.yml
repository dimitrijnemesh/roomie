services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roomie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roomie}
      POSTGRES_DB: ${POSTGRES_DB:-roomie}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roomie} -d ${POSTGRES_DB:-roomie}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-roomie}:${POSTGRES_PASSWORD:-roomie}@db:5432/${POSTGRES_DB:-roomie}?schema=public
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
